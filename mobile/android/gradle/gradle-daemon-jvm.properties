# Capacitor 8 (Gradle 8.14, plugin Android 8.13) se compile avec Java 21.
# Android Studio embarque désormais Java 25, que ce Gradle ne sait pas lire
# (« Unsupported class file major version 69 ») : on fixe donc le JDK du
# démon Gradle ici, pour l'IDE comme pour la ligne de commande. Gradle trouve
# lui-même un JDK 21 installé (Homebrew, Android Studio, java_home…).
toolchainVersion=21
