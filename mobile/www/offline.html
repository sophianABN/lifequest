<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>LifeQuest — hors connexion</title>
  <!--
    Page embarquée dans l'application, affichée quand le site est injoignable
    (`server.errorPath` de capacitor.config.ts). Elle ne peut compter sur rien
    de distant : ni polices, ni images, ni plugins natifs sur Android. Tout est
    donc en ligne, dans les couleurs de `globals.css`.
  -->
  <style>
    :root {
      --background: #fdfbf9;
      --foreground: #2a2430;
      --muted: #6b6076;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #17131d;
        --foreground: #f2eff5;
        --muted: #a79eb3;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background-color: var(--background);
      background-image:
        radial-gradient(40rem 28rem at 8% -10%, rgb(248 187 208 / 0.35), transparent 60%),
        radial-gradient(36rem 26rem at 95% 0%, rgb(201 182 228 / 0.32), transparent 60%),
        radial-gradient(34rem 30rem at 50% 110%, rgb(167 232 224 / 0.28), transparent 60%);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      text-align: center;
    }
    main { width: 100%; max-width: 22rem; }
    svg { display: block; margin: 0 auto 28px; filter: drop-shadow(0 12px 28px rgb(169 138 212 / 0.35)); }
    h1 {
      margin: 0 0 12px;
      font-family: ui-serif, "New York", Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.55; font-size: 0.95rem; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 28px;
      min-width: 12rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(100deg, #f295b6, #a98ad4 55%, #45bcae);
      box-shadow: 0 10px 24px rgb(228 115 156 / 0.3);
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    button[disabled] { opacity: 0.6; }
    .hint { margin-top: 18px; margin-bottom: 0; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <svg width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f295b6" />
          <stop offset="48%" stop-color="#a98ad4" />
          <stop offset="100%" stop-color="#45bcae" />
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="17" fill="url(#b)" />
      <path d="M13.5 51 C 22 51 29.5 46 34.5 36.5" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round" />
      <circle cx="13.5" cy="51" r="4" fill="#fff" />
      <g transform="translate(35 8) scale(0.95)" fill="#fff">
        <path d="M12 0c.6 5.6 5.8 10.8 11.4 11.4v1.2C17.8 13.2 12.6 18.4 12 24h-1.2C10.2 18.4 5 13.2-.6 12.6v-1.2C5 10.8 10.2 5.6 10.8 0Z" />
      </g>
    </svg>

    <h1 id="title">Pas de connexion</h1>
    <p id="message">
      Ta quête t'attend. Dès que le réseau revient, tu reprends exactement là où tu en étais.
    </p>
    <button id="retry" type="button">Réessayer</button>
    <p class="hint" id="hint" hidden>Nouvelle tentative automatique dès le retour du réseau.</p>
  </main>

  <script>
    // Adresse du site — doit correspondre à `server.url` de capacitor.config.ts.
    // Sur Android, cette page est servie sous l'origine du site : on la réutilise,
    // ce qui suit aussi un serveur de développement. Sur iOS, elle vit sous
    // `capacitor://localhost` et n'a que cette constante.
    var APP_URL = "https://lifequest.absoley.fr";
    var origin = location.protocol === "https:" || location.protocol === "http:" ? location.origin : APP_URL;

    var title = document.getElementById("title");
    var message = document.getElementById("message");
    var retry = document.getElementById("retry");
    var hint = document.getElementById("hint");

    function render() {
      if (navigator.onLine) {
        // En ligne mais le site n'a pas répondu : maintenance ou déploiement.
        title.textContent = "LifeQuest ne répond pas";
        message.textContent =
          "Le serveur est momentanément indisponible. Tes données sont en sécurité : réessaie dans quelques instants.";
        hint.hidden = true;
      } else {
        title.textContent = "Pas de connexion";
        message.textContent =
          "Ta quête t'attend. Dès que le réseau revient, tu reprends exactement là où tu en étais.";
        hint.hidden = false;
      }
    }

    function reload() {
      retry.disabled = true;
      retry.textContent = "Connexion…";
      location.replace(origin + "/");
    }

    retry.addEventListener("click", reload);
    window.addEventListener("online", reload);
    window.addEventListener("offline", render);
    render();

    // Hors connexion au lancement, le site n'a jamais pu masquer l'écran de
    // démarrage : cette page s'en charge. Le pont Capacitor y est injecté (même
    // origine que le site sur Android, schéma local sur iOS).
    try {
      window.Capacitor && window.Capacitor.Plugins.SplashScreen.hide();
    } catch (e) {
      // Navigateur ordinaire : rien à masquer.
    }
  </script>
</body>
</html>
